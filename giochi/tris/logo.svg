<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Neon glow filters -->
    <filter id="neon-cyan">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="neon-magenta">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradient for background -->
    <radialGradient id="bg-gradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-gradient)"/>
  
  <!-- Grid lines -->
  <line x1="80" y1="150" x2="320" y2="150" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="250" x2="320" y2="250" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="50" x2="160" y2="350" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="50" x2="240" y2="350" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  
  <!-- X symbol (cyan neon) -->
  <g filter="url(#neon-cyan)">
    <line x1="100" y1="70" x2="140" y2="130" stroke="#00ffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="140" y1="70" x2="100" y2="130" stroke="#00ffff" stroke-width="8" stroke-linecap="round"/>
    
    <line x1="260" y1="270" x2="300" y2="330" stroke="#00ffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="300" y1="270" x2="260" y2="330" stroke="#00ffff" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- O symbol (magenta neon) -->
  <g filter="url(#neon-magenta)">
    <circle cx="200" cy="100" r="35" stroke="#ff00ff" stroke-width="8" fill="none"/>
    <circle cx="120" cy="200" r="35" stroke="#ff00ff" stroke-width="8" fill="none"/>
    <circle cx="280" cy="200" r="35" stroke="#ff00ff" stroke-width="8" fill="none"/>
  </g>
  
  <!-- Corner decorations -->
  <circle cx="50" cy="50" r="8" fill="#00ffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="50" r="8" fill="#ff00ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="50" cy="350" r="8" fill="#ff00ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="350" cy="350" r="8" fill="#00ffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg>
